<!DOCTYPE html>
<html lang="tr" data-mode="light" data-accent="mavi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6BFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Denge — Borç Takip &amp; Finans</title>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#FBFBFD;
  --text:#0F1524; --muted:#66708A; --border:#E8EAF1;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 24px -8px rgba(16,24,40,.10);
  --shadow-lg:0 8px 40px -8px rgba(16,24,40,.18);
  --ok:#12B76A; --warn:#F59E0B; --bad:#EF4444;
  --r:18px; --r-sm:12px;
  --nav-h:64px;
  color-scheme:light;
}
html[data-mode="dark"]{
  --bg:#0B0E15; --surface:#141926; --surface-2:#10141F;
  --text:#EDF0F7; --muted:#8B94AB; --border:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 30px -10px rgba(0,0,0,.6);
  --shadow-lg:0 10px 50px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
/* accent themes */
html[data-accent="mavi"]{--accent:#2E6BFF;--accent-2:#1C4FD6;--accent-soft:rgba(46,107,255,.11);--on-accent:#fff}
html[data-accent="mor"]{--accent:#7C5CFF;--accent-2:#5F3FE0;--accent-soft:rgba(124,92,255,.12);--on-accent:#fff}
html[data-accent="yesil"]{--accent:#0FA968;--accent-2:#0B8552;--accent-soft:rgba(15,169,104,.12);--on-accent:#fff}
html[data-accent="turuncu"]{--accent:#F0700A;--accent-2:#C75A05;--accent-soft:rgba(240,112,10,.12);--on-accent:#fff}
html[data-accent="kirmizi"]{--accent:#E5484D;--accent-2:#C13338;--accent-soft:rgba(229,72,77,.12);--on-accent:#fff}
html[data-accent="turkuaz"]{--accent:#0AA8BD;--accent-2:#088799;--accent-soft:rgba(10,168,189,.12);--on-accent:#fff}
html[data-accent="siyah"]{--accent:#17181D;--accent-2:#000;--accent-soft:rgba(23,24,29,.08);--on-accent:#F6E7B2}
html[data-mode="dark"][data-accent="siyah"]{--accent:#E9E2CF;--accent-2:#CFC5A8;--accent-soft:rgba(233,226,207,.10);--on-accent:#17181D}

/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif;
  background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.45;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100dvh}
.sidebar{
  display:none;width:236px;flex-shrink:0;padding:20px 14px;gap:4px;
  flex-direction:column;position:sticky;top:0;height:100dvh;
  border-right:1px solid var(--border);background:var(--surface-2);
}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 22px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--on-accent);box-shadow:var(--shadow)}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--muted);font-weight:600;font-size:14px;width:100%;text-align:left;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--accent-soft);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item svg{flex-shrink:0}
.main{flex:1;min-width:0;padding:0 16px calc(var(--nav-h) + 96px);max-width:1120px;margin:0 auto;width:100%}

/* topbar */
.topbar{
  display:flex;align-items:center;gap:10px;padding:14px 0 10px;
  position:sticky;top:0;z-index:40;background:var(--bg);
  transition:background .25s;
}
.topbar .title{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-right:auto;white-space:nowrap}
.searchwrap{position:relative;flex:1;max-width:340px;margin-left:auto}
.searchwrap input{
  width:100%;padding:9px 12px 9px 36px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);box-shadow:var(--shadow);font-size:14px;
}
.searchwrap>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);
  max-height:320px;overflow:auto;z-index:60;
}
.sr-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--accent-soft)}
.sr-item .t{font-weight:600;font-size:14px}
.sr-item .s{font-size:12px;color:var(--muted)}
.iconbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  color:var(--muted);position:relative;transition:transform .12s;flex-shrink:0;
}
.iconbtn:active{transform:scale(.93)}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}

/* ============ CARDS & GRID ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;transition:background .25s,border .25s}
.card.pad-lg{padding:20px}
.card-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;gap:12px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-4{grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.grid.cols-4{grid-template-columns:repeat(4,1fr)}}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.section-h h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.section-h .link{font-size:13px;font-weight:600;color:var(--accent)}

/* hero */
.hero{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--on-accent);border:none;border-radius:22px;padding:22px 20px;
  position:relative;overflow:hidden;box-shadow:0 12px 36px -10px color-mix(in srgb,var(--accent) 55%,transparent);
}
.hero::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);top:-160px;right:-100px;pointer-events:none}
.hero .label{font-size:13px;font-weight:600;opacity:.85}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:4px 0 10px}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;opacity:.92}
.hero .sub b{font-weight:700}

/* stat cards */
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .d{font-size:12px;margin-top:4px;color:var(--muted)}
.stat.alert .v{color:var(--bad)}
.stat.good .v{color:var(--ok)}

/* progress */
.prog{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:8px}
.prog>span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog.warn>span{background:var(--warn)}
.prog.bad>span{background:var(--bad)}

/* list rows */
.rowitem{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);width:100%;text-align:left;border-radius:8px}
.rowitem:last-child{border-bottom:none}
.rowitem:hover{background:var(--surface-2)}
.rowitem .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent)}
.rowitem .mid{flex:1;min-width:0}
.rowitem .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .amt{font-weight:800;font-size:14px;text-align:right;white-space:nowrap}
.rowitem .amt .s{font-weight:600}
.amt.in{color:var(--ok)} .amt.out{color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.badge.ok{background:rgba(18,183,106,.13);color:var(--ok)}
.badge.warn{background:rgba(245,158,11,.14);color:#B45309}
html[data-mode="dark"] .badge.warn{color:#FBBF24}
.badge.bad{background:rgba(239,68,68,.13);color:var(--bad)}
.badge.mut{background:var(--accent-soft);color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;
  padding:10px 16px;border-radius:12px;transition:transform .12s,opacity .15s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.ghost{background:var(--surface);border-color:var(--border);color:var(--text);box-shadow:var(--shadow)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:rgba(239,68,68,.1);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}

/* chips & filters */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.filterbar select{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text);max-width:46%}

/* tabs */
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.tab{flex:1;padding:9px 4px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);text-align:center;transition:background .15s,color .15s}
.tab.on{background:var(--accent);color:var(--on-accent)}

/* credit card visual */
.ccard{border-radius:18px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-lg);width:100%;text-align:left}
.ccard::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.25),transparent 55%)}
.ccard .bank{font-size:12px;font-weight:700;opacity:.9;letter-spacing:.03em}
.ccard .cname{font-size:16px;font-weight:800}
.ccard .digits{font-family:ui-monospace,monospace;letter-spacing:.18em;font-size:14px;opacity:.95}
.ccard .row2{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1}
.ccard .mini{font-size:11px;opacity:.85}
.ccard .mval{font-size:15px;font-weight:800}

/* ============ CHARTS ============ */
.chartwrap{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.legend .li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.legend .sw{width:10px;height:10px;border-radius:3px}
.donutbox{display:flex;align-items:center;gap:18px}
.donutbox svg{flex-shrink:0}

/* ============ CALENDAR ============ */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead .m{font-weight:800;font-size:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cday{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;position:relative;border:1px solid transparent}
.cday.out{opacity:.28}
.cday.today{border-color:var(--accent);color:var(--accent);font-weight:800}
.cday.sel{background:var(--accent);color:var(--on-accent)}
.cday .dots{display:flex;gap:3px;height:5px}
.cday .dots i{width:5px;height:5px;border-radius:50%;display:block}

/* ============ BOTTOM NAV ============ */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:6px 0}
.bn-item.active{color:var(--accent)}
.fab{
  width:54px;height:54px;border-radius:50%;margin:-26px auto 0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);
  display:grid;place-items:center;box-shadow:0 10px 24px -6px color-mix(in srgb,var(--accent) 65%,transparent);
  transition:transform .15s;
}
.fab:active{transform:scale(.9) rotate(90deg)}
@media(min-width:900px){
  .sidebar{display:flex}
  .bottomnav{display:none}
  .main{padding:0 28px 60px}
  .grid.cols-2.desk-4{grid-template-columns:repeat(2,1fr)}
  .dash-2col{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:start}
}

/* ============ MODAL / SHEET ============ */
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.5);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .18s}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:460px;max-height:88dvh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;position:sticky;top:0;background:var(--surface);z-index:2}
.modal .mh h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.modal .mb{padding:10px 18px 18px}
.sheet-wrap{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:80;display:flex;align-items:flex-end;animation:fade .18s}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.9,.3,1.05);max-height:80dvh;overflow:auto}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 12px}
@media(min-width:900px){.sheet-wrap{align-items:center;justify-content:center;padding:16px}.sheet{border-radius:20px;max-width:420px}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}

/* forms */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);font-size:14.5px;transition:border .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field .err{color:var(--bad);font-size:12px;margin-top:4px;display:none}
.field.invalid input,.field.invalid select{border-color:var(--bad)}
.field.invalid .err{display:block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colorpick{display:flex;gap:8px;flex-wrap:wrap}
.colorpick button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;transition:transform .12s}
.colorpick button.on{border-color:var(--text);transform:scale(1.1)}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px)}
@media(min-width:900px){.toasts{bottom:24px}}
.toast{background:var(--text);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);animation:up .25s}
.toast .undo{margin-left:auto;color:var(--accent);font-weight:800;background:var(--bg);padding:5px 12px;border-radius:9px;font-size:13px}
html[data-mode="dark"] .toast{background:#fff;color:#0F1524}

/* notif panel */
.notif-panel{position:fixed;top:64px;right:16px;width:min(92vw,360px);background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);z-index:70;overflow:hidden;animation:pop .2s}
.notif-panel .nh{padding:14px 16px 8px;font-weight:800;font-size:15px}
.notif-panel .nlist{max-height:52dvh;overflow:auto;padding:0 8px 8px}

/* skeleton */
.skel{border-radius:14px;background:linear-gradient(100deg,var(--surface) 40%,var(--accent-soft) 50%,var(--surface) 60%);background-size:200% 100%;animation:sh 1.1s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 16px;text-align:center;color:var(--muted)}
.empty .eic{width:64px;height:64px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty h4{color:var(--text);font-size:16px}
.empty p{font-size:13.5px;max-width:280px}

/* tables (reports) */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.r,.tbl th.r{text-align:right}

/* settings swatches */
.themegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.themegrid button{border-radius:14px;padding:12px 6px;border:2px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface)}
.themegrid button.on{border-color:var(--accent);color:var(--text)}
.themegrid .sw{width:26px;height:26px;border-radius:50%}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--border);gap:10px}
.setrow:last-child{border-bottom:none}
.setrow .t{font-weight:700;font-size:14.5px}
.setrow .s{font-size:12.5px;color:var(--muted)}
.switch{width:46px;height:27px;border-radius:99px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{left:22px}

@media print{
  .sidebar,.bottomnav,.topbar,.fab,.no-print{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
  .main{padding:0;max-width:100%}
}
</style>
</head>
<body>
<div class="app">
  <!-- Desktop sidebar -->
  <aside class="sidebar" aria-label="Ana menü">
    <div class="brand"><span class="logo" id="brandLogo"></span> Denge</div>

/* ---------- Utils ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const TL = (n, dec = 0) => new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", minimumFractionDigits: 0, maximumFractionDigits: dec }).format(n || 0);
const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const DOWS = ["Pt","Sa","Ça","Pe","Cu","Ct","Pz"];
const pad2 = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addMonths = (d, k) => { const x = new Date(d.getFullYear(), d.getMonth() + k, 1); const dim = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(d.getDate(), dim)); return x; };
const addDays = (d, k) => { const x = new Date(d); x.setDate(x.getDate() + k); return x; };
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) - (b.getDate() < a.getDate() ? 1 : 0);
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const fmtDate = d => { const x = d instanceof Date ? d : fromISO(d); return `${x.getDate()} ${MONTHS[x.getMonth()].slice(0, 3)} ${x.getFullYear()}`; };
const fmtDay = d => { const x = d instanceof Date ? d : fromISO(d); return `${x.getDate()} ${MONTHS[x.getMonth()].slice(0, 3)}`; };
const ymKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
const relDue = d => { const k = daysBetween(today(), d); if (k < 0) return `${-k} gün gecikti`; if (k === 0) return "Bugün"; if (k === 1) return "Yarın"; return `${k} gün sonra`; };

/* ---------- Storage (localStorage → bellek yedeği) ---------- */
const Store = (() => {
  const KEY = "denge.v1"; let mem = null; let persistent = true;
  const load = () => { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { persistent = false; return mem; } };
  const save = data => { mem = data; try { localStorage.setItem(KEY, JSON.stringify(data)); persistent = true; } catch (e) { persistent = false; } };
  const wipe = () => { mem = null; try { localStorage.removeItem(KEY); } catch (e) {} };
  return { load, save, wipe, get persistent() { return persistent; } };
})();

/* ---------- State ---------- */
const blankState = () => ({
  loans: [], cards: [], insts: [], txs: [],
  settings: { mode: "light", accent: "mavi" },
});
let S = Store.load() || blankState();
let route = { view: "dash", params: {} };

/* ---------- Sabitler ---------- */
const LOAN_TYPES = ["İhtiyaç", "Konut", "Taşıt", "Eğitim", "Ticari", "Diğer"];
const EXP_CATS = ["Market", "Fatura", "Kira", "Ulaşım", "Yemek", "Sağlık", "Eğlence", "Giyim", "Abonelik", "Diğer"];
const INC_CATS = ["Maaş", "Ek Gelir", "Yatırım", "Kira Geliri", "Diğer"];
const INST_CATS = ["Elektronik", "Telefon", "Mobilya", "Tatil", "Market", "Sağlık", "Giyim", "Eğitim", "Diğer"];
const CARD_COLORS = ["#1E293B", "#2E6BFF", "#7C5CFF", "#0FA968", "#E5484D", "#F0700A", "#0AA8BD", "#6B21A8"];
const PALETTE = ["#2E6BFF", "#7C5CFF", "#0FA968", "#F0700A", "#E5484D", "#0AA8BD", "#EAB308", "#EC4899", "#64748B", "#14B8A6"];
const ACCENTS = [
  { id: "mavi", name: "Mavi", hex: "#2E6BFF" }, { id: "mor", name: "Mor", hex: "#7C5CFF" },
  { id: "yesil", name: "Yeşil", hex: "#0FA968" }, { id: "turuncu", name: "Turuncu", hex: "#F0700A" },
  { id: "kirmizi", name: "Kırmızı", hex: "#E5484D" }, { id: "turkuaz", name: "Turkuaz", hex: "#0AA8BD" },
  { id: "siyah", name: "Premium", hex: "#17181D" },
];

/* ---------- Hesap motoru ---------- */
const Calc = {
  // Kredi
  loanExtra: l => (l.extras || []).reduce((t, e) => t + e.amount, 0),
  loanRemainTerm: l => Math.max(0, l.term - l.paid),
  loanRemain(l) { return Math.max(0, this.loanRemainTerm(l) * l.monthly - this.loanExtra(l)); },
  loanTotalPay: l => l.term * l.monthly,
  loanInterest(l) { return Math.max(0, this.loanTotalPay(l) - l.amount); },
  loanPaidTotal(l) { return l.paid * l.monthly + this.loanExtra(l); },
  loanNextDue(l) { return this.loanRemainTerm(l) > 0 ? addMonths(fromISO(l.firstDue), l.paid) : null; },
  loanDueCount(l) { const el = monthsBetween(fromISO(l.firstDue), today()) + 1; return clamp(el, 0, l.term); },
  loanOverdue(l) { return Math.max(0, this.loanDueCount(l) - l.paid); },
  loanEnd: l => addMonths(fromISO(l.firstDue), l.term - 1),
  // Taksit
  instRemain: i => Math.max(0, (i.total - i.paid) * i.monthly),
  instNextDue: i => i.paid < i.total ? addMonths(fromISO(i.firstDue), i.paid) : null,
  instDueCount: i => clamp(monthsBetween(fromISO(i.firstDue), today()) + 1, 0, i.total),
  instOverdue(i) { return Math.max(0, this.instDueCount(i) - i.paid); },
  instEnd: i => addMonths(fromISO(i.firstDue), i.total - 1),
  // Kart
  cardAvail: c => Math.max(0, c.limit - c.debt),
  cardUsePct: c => c.limit > 0 ? clamp(Math.round(c.debt / c.limit * 100), 0, 100) : 0,
  cardMin: c => Math.round(c.debt * (c.minRate || 20) / 100),
  cardDue(c) { // içinde bulunulan döngünün son ödeme tarihi
    const t = today(); let d = new Date(t.getFullYear(), t.getMonth(), clamp(c.dueDay, 1, 28));
    return d;
  },
  cardNextDue(c) { const d = this.cardDue(c); return d >= today() ? d : addMonths(d, 1); },
  cardOverdue(c) { const d = this.cardDue(c); return c.debt > 0 && d < today() && c.lastPaid !== ymKey(d); },
  cardPaidThis(c) { return c.lastPaid === ymKey(this.cardDue(c)); },
  // Toplamlar
  totalDebt() {
    return S.loans.reduce((t, l) => t + this.loanRemain(l), 0)
      + S.cards.reduce((t, c) => t + c.debt, 0)
      + S.insts.reduce((t, i) => t + this.instRemain(i), 0);
  },
  monthlyLoad() {
    return S.loans.reduce((t, l) => t + (this.loanRemainTerm(l) > 0 ? l.monthly : 0), 0)
      + S.insts.reduce((t, i) => t + (i.paid < i.total ? i.monthly : 0), 0);
  },
  txMonth(y, m) { // {inc, exp, byCat}
    const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
    let inc = 0, exp = 0; const byCat = {};
    for (const t of S.txs) {
      const d = fromISO(t.date); let hit = false;
      if (t.repeat === "monthly") hit = d <= last && (d.getFullYear() < y || (d.getFullYear() === y && d.getMonth() <= m));
      else hit = d >= first && d <= last;
      if (!hit) continue;
      if (t.kind === "in") inc += t.amount; else { exp += t.amount; byCat[t.category] = (byCat[t.category] || 0) + t.amount; }
    }
    return { inc, exp, byCat };
  },
};

/* ---------- Ödeme akışı (yaklaşan + geciken) ---------- */
function dueItems(days = 31) {
  const t = today(), until = addDays(t, days), out = [];
  for (const l of S.loans) {
    const od = Calc.loanOverdue(l);
    if (od > 0) out.push({ kind: "loan", id: l.id, title: l.bank + " · " + l.type + " Kredisi", amount: od * l.monthly, date: Calc.loanNextDue(l), status: "late", note: od + " taksit gecikti" });
    else { const nd = Calc.loanNextDue(l); if (nd && nd <= until) out.push({ kind: "loan", id: l.id, title: l.bank + " · " + l.type + " Kredisi", amount: l.monthly, date: nd, status: "due", note: (l.paid + 1) + "/" + l.term + ". taksit" }); }
  }
  for (const i of S.insts) {
    const od = Calc.instOverdue(i);
    if (od > 0) out.push({ kind: "inst", id: i.id, title: i.title, amount: od * i.monthly, date: Calc.instNextDue(i), status: "late", note: od + " taksit gecikti" });
    else { const nd = Calc.instNextDue(i); if (nd && nd <= until) out.push({ kind: "inst", id: i.id, title: i.title, amount: i.monthly, date: nd, status: "due", note: (i.paid + 1) + "/" + i.total + ". taksit" }); }
  }
  for (const c of S.cards) {
    if (Calc.cardOverdue(c)) out.push({ kind: "card", id: c.id, title: c.bank + " · " + c.name, amount: c.debt, date: Calc.cardDue(c), status: "late", note: "Ekstre gecikti · Asgari " + TL(Calc.cardMin(c)) });
    else if (c.debt > 0 && !Calc.cardPaidThis(c)) { const nd = Calc.cardNextDue(c); if (nd <= until) out.push({ kind: "card", id: c.id, title: c.bank + " · " + c.name, amount: c.debt, date: nd, status: "due", note: "Ekstre borcu · Asgari " + TL(Calc.cardMin(c)) }); }
  }
  return out.sort((a, b) => (a.status === "late" ? -1 : 1) - (b.status === "late" ? -1 : 1) || a.date - b.date);
}
function notifications() {
  const out = []; const t = today();
  for (const it of dueItems(7)) {
    const k = daysBetween(t, it.date);
    if (it.status === "late") out.push({ tone: "bad", icon: "alert", title: it.title, sub: it.note + " · " + relDue(it.date) });
    else if (k === 0) out.push({ tone: "warn", icon: "bell", title: it.title, sub: "Bugün ödenecek · " + TL(it.amount) });
    else out.push({ tone: "mut", icon: "cal", title: it.title, sub: relDue(it.date) + " · " + TL(it.amount) });
  }
  for (const c of S.cards) {
    const p = Calc.cardUsePct(c);
    if (p >= 85) out.push({ tone: p >= 95 ? "bad" : "warn", icon: "card", title: c.bank + " · " + c.name, sub: "Limit %" + p + " dolu" });
  }
  for (const l of S.loans) { const r = Calc.loanRemainTerm(l); if (r > 0 && r <= 3) out.push({ tone: "ok", icon: "check", title: l.bank + " · " + l.type + " Kredisi", sub: "Son " + r + " taksit kaldı 🎉" }); }
  return out;
}
const alertCount = () => dueItems(3).length + S.cards.filter(c => Calc.cardUsePct(c) >= 85).length;

/* ---------- SVG grafikler (bağımsız, çevrimdışı) ---------- */
const Charts = {
  donut(segs, size = 132, hole = 0.66) {
    const total = segs.reduce((t, s) => t + s.v, 0);
    if (total <= 0) return `<div class="empty" style="padding:18px"><p>Gösterilecek veri yok</p></div>`;
    const r = size / 2 - 6, C = 2 * Math.PI * r; let off = C * 0.25;
    const rings = segs.filter(s => s.v > 0).map(s => {
      const len = s.v / total * C;
      const el = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${(1 - hole) * r}" stroke-dasharray="${Math.max(0, len - 2)} ${C - len + 2}" stroke-dashoffset="${off}" stroke-linecap="butt"/>`;
      off -= len; return el;
    }).join("");
    const legend = segs.filter(s => s.v > 0).map(s =>
      `<span class="li"><span class="sw" style="background:${s.c}"></span>${esc(s.l)} <b class="num" style="color:var(--text)">${TL(s.v)}</b></span>`).join("");
    return `<div class="donutbox"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Dağılım grafiği">${rings}
      <text x="50%" y="47%" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">Toplam</text>
      <text x="50%" y="60%" text-anchor="middle" font-size="13" font-weight="800" fill="var(--text)" class="num">${TL(total)}</text></svg>
      <div class="legend" style="flex-direction:column;align-items:flex-start;gap:8px">${legend}</div></div>`;
  },
  bars(labels, a, b, la = "Gelir", lb = "Gider") {
    const W = 560, H = 200, P = 26, max = Math.max(...a, ...b, 1);
    const n = labels.length, gw = (W - P * 2) / n, bw = Math.min(20, gw * 0.28);
    let el = "";
    labels.forEach((lab, i) => {
      const x = P + gw * i + gw / 2;
      const ha = (a[i] / max) * (H - 58), hb = (b[i] / max) * (H - 58);
      el += `<rect x="${x - bw - 2}" y="${H - 34 - ha}" width="${bw}" height="${Math.max(2, ha)}" rx="4.5" fill="var(--ok)"/>`;
      el += `<rect x="${x + 2}" y="${H - 34 - hb}" width="${bw}" height="${Math.max(2, hb)}" rx="4.5" fill="var(--bad)" opacity=".85"/>`;
      el += `<text x="${x}" y="${H - 14}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">${esc(lab)}</text>`;
    });
    return `<svg class="chartwrap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aylık gelir gider grafiği">
      <line x1="${P}" x2="${W - P}" y1="${H - 34}" y2="${H - 34}" stroke="var(--border)"/>${el}</svg>
      <div class="legend"><span class="li"><span class="sw" style="background:var(--ok)"></span>${la}</span><span class="li"><span class="sw" style="background:var(--bad)"></span>${lb}</span></div>`;
  },
  line(labels, vals, label = "Kalan borç") {
    const W = 560, H = 190, P = 30, max = Math.max(...vals, 1), min = Math.min(...vals, 0);
    const span = Math.max(1, max - min);
    const pts = vals.map((v, i) => [P + (W - 2 * P) * (i / Math.max(1, vals.length - 1)), 18 + (H - 60) * (1 - (v - min) / span)]);
    const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = path + ` L ${pts[pts.length - 1][0].toFixed(1)} ${H - 34} L ${P} ${H - 34} Z`;
    const labs = labels.map((l, i) => (labels.length > 8 && i % 2) ? "" :
      `<text x="${pts[i][0]}" y="${H - 14}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--muted)">${esc(l)}</text>`).join("");
    return `<svg class="chartwrap" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} grafiği">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      <line x1="${P}" x2="${W - P}" y1="${H - 34}" y2="${H - 34}" stroke="var(--border)"/>
      <path d="${area}" fill="url(#lg)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="4" fill="var(--accent)"/>${labs}</svg>`;
  },
};

/* ---------- Router ---------- */
const VIEWS = {
  dash: { t: "Özet", i: "home" }, loans: { t: "Krediler", i: "bank" }, cards: { t: "Kartlar", i: "card" },
  insts: { t: "Taksitler", i: "bag" }, money: { t: "Gelir · Gider", i: "coins" }, calendar: { t: "Takvim", i: "cal" },
  reports: { t: "Raporlar", i: "chart" }, settings: { t: "Ayarlar", i: "gear" },
};
function go(v, params = {}) {
  if (v === "menu") return openMenuSheet();
  route = { view: v, params };
  closeAll(); render();
  window.scrollTo({ top: 0 });
}
function render() {
  const v = route.view;
  $("#pageTitle").textContent = VIEWS[v]?.t || "Denge";
  $("#view").innerHTML = ({ dash: vDash, loans: vLoans, cards: vCards, insts: vInsts, money: vMoney, calendar: vCal, reports: vReports, settings: vSettings })[v]();
  // sidebar
  $("#sideNav").innerHTML = Object.entries(VIEWS).map(([k, o]) =>
    `<button class="nav-item ${k === v ? "active" : ""}" onclick="go('${k}')">${Icons[o.i](20)} ${o.t}</button>`).join("");
  // bottom nav aktiflik
  document.querySelectorAll(".bn-item").forEach(b => {
    const g = b.dataset.go;
    const on = g === v || (g === "loans" && ["loans", "cards", "insts"].includes(v)) || (g === "menu" && ["calendar", "reports", "settings"].includes(v));
    b.classList.toggle("active", on);
  });
  updateBell();
}
const debtTabs = cur => `<div class="tabs" role="tablist">${[["loans", "Krediler"], ["cards", "Kartlar"], ["insts", "Taksitler"]].map(([k, t]) =>
  `<button class="tab ${k === cur ? "on" : ""}" role="tab" aria-selected="${k === cur}" onclick="go('${k}')">${t}</button>`).join("")}</div>`;

/* ---------- ÖZET ---------- */
function vDash() {
  const t = today();
  const totalDebt = Calc.totalDebt();
  if (totalDebt === 0 && !S.txs.length && !S.loans.length && !S.cards.length && !S.insts.length) {
    return `<div class="card pad-lg"><div class="empty">
      <span class="eic">${Icons.scale(30)}</span>
      <h4>Denge'ye hoş geldin 👋</h4>
      <p>Kredilerini, kartlarını ve harcamalarını tek yerden takip et. Önce bir göz atmak istersen örnek verilerle başlayabilirsin.</p>
      <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center">
        <button class="btn primary" onclick="openQuickAdd()">${Icons.plus(17)} Hemen ekle</button>
        <button class="btn ghost" onclick="loadDemo()">Örnek veri yükle</button>
      </div></div></div>`;
  }
  const due = dueItems(31);
  const inDays = k => due.filter(x => x.status !== "late" && daysBetween(t, x.date) <= k).reduce((s, x) => s + x.amount, 0);
  const late = due.filter(x => x.status === "late");
  const lateSum = late.reduce((s, x) => s + x.amount, 0);
  const limit = S.cards.reduce((s, c) => s + c.limit, 0);
  const used = S.cards.reduce((s, c) => s + c.debt, 0);
  const mnow = Calc.txMonth(t.getFullYear(), t.getMonth());
  const interest = S.loans.reduce((s, l) => s + Calc.loanInterest(l), 0);
  // bitiş tahmini
  const ends = [...S.loans.filter(l => Calc.loanRemainTerm(l) > 0).map(Calc.loanEnd.bind(Calc)), ...S.insts.filter(i => i.paid < i.total).map(Calc.instEnd.bind(Calc))];
  const endD = ends.length ? new Date(Math.max(...ends.map(d => d.getTime()))) : null;
  // 12 ay projeksiyon
  const proj = [], plab = [];
  let rem = totalDebt;
  for (let k = 0; k <= 12; k++) {
    plab.push(k === 0 ? "Şimdi" : MONTHS[addMonths(t, k).getMonth()].slice(0, 3));
    proj.push(Math.max(0, Math.round(rem)));
    const mo = addMonths(t, k + 1);
    let pay = 0;
    for (const l of S.loans) { const e = Calc.loanEnd(l); if (Calc.loanRemainTerm(l) > 0 && addMonths(fromISO(l.firstDue), l.paid) <= mo && mo <= addDays(e, 1)) pay += l.monthly; }
    for (const i of S.insts) { if (i.paid < i.total && addMonths(fromISO(i.firstDue), i.paid) <= mo && mo <= addDays(Calc.instEnd(i), 1)) pay += i.monthly; }
    rem -= pay;
  }
  // nakit akışı 6 ay
  const blab = [], binc = [], bexp = [];
  for (let k = 5; k >= 0; k--) { const d = addMonths(t, -k); const r = Calc.txMonth(d.getFullYear(), d.getMonth()); blab.push(MONTHS[d.getMonth()].slice(0, 3)); binc.push(r.inc); bexp.push(r.exp); }
  const dist = [
    { l: "Krediler", v: S.loans.reduce((s, l) => s + Calc.loanRemain(l), 0), c: PALETTE[0] },
    { l: "Kredi Kartları", v: used, c: PALETTE[4] },
    { l: "Taksitler", v: S.insts.reduce((s, i) => s + Calc.instRemain(i), 0), c: PALETTE[3] },
  ];
  const catSegs = Object.entries(mnow.byCat).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([l, v], i) => ({ l, v, c: PALETTE[i % PALETTE.length] }));
  return `
  <div class="hero">
    <div class="label">Toplam Kalan Borç</div>
    <div class="big num">${TL(totalDebt)}</div>
    <div class="sub">
      <span>Aylık taksit yükü <b class="num">${TL(Calc.monthlyLoad())}</b></span>
      ${endD ? `<span>Bu hızla bitiş: <b>${MONTHS[endD.getMonth()].slice(0, 3)} ${endD.getFullYear()}</b></span>` : ""}
      <span>Toplam faiz <b class="num">${TL(interest)}</b></span>
    </div>
  </div>

  ${late.length ? `<div class="card" style="margin-top:12px;border-color:rgba(239,68,68,.4)">
    <button class="rowitem" onclick="go('calendar')" style="padding:2px">
      <span class="ic" style="background:rgba(239,68,68,.12);color:var(--bad)">${Icons.alert(20)}</span>
      <span class="mid"><span class="t">Geciken ödeme: ${late.length}</span><span class="s">Toplam ${TL(lateSum)} · takvimde gör</span></span>
      <span style="color:var(--muted)">${Icons.chevR(18)}</span>
    </button></div>` : ""}

  <div class="grid cols-4" style="margin-top:12px">
    <div class="card stat"><div class="l">Bugün Ödenecek</div><div class="v num">${TL(inDays(0))}</div></div>
    <div class="card stat"><div class="l">Bu Hafta</div><div class="v num">${TL(inDays(7))}</div></div>
    <div class="card stat"><div class="l">Bu Ay</div><div class="v num">${TL(inDays(31))}</div></div>
    <div class="card stat ${lateSum ? "alert" : "good"}"><div class="l">Geciken</div><div class="v num">${TL(lateSum)}</div></div>
  </div>

  <div class="grid cols-2" style="margin-top:12px">
    <div class="card stat">
      <div class="l">Kart Limiti</div><div class="v num">${TL(Math.max(0, limit - used))} <span style="font-size:12px;color:var(--muted);font-weight:600">boşta</span></div>
      <div class="d num">${TL(used)} / ${TL(limit)} kullanıldı</div>
      <div class="prog ${used / Math.max(1, limit) > .9 ? "bad" : used / Math.max(1, limit) > .7 ? "warn" : ""}"><span style="width:${limit ? clamp(used / limit * 100, 0, 100) : 0}%"></span></div>
    </div>
    <div class="card stat">
      <div class="l">${MONTHS[t.getMonth()]} Özeti</div>
      <div class="v num" style="color:${mnow.inc - mnow.exp >= 0 ? "var(--ok)" : "var(--bad)"}">${TL(mnow.inc - mnow.exp)} <span style="font-size:12px;color:var(--muted);font-weight:600">tasarruf</span></div>
      <div class="d num">Gelir ${TL(mnow.inc)} · Gider ${TL(mnow.exp)}</div>
      <div class="prog"><span style="width:${mnow.inc ? clamp(mnow.exp / mnow.inc * 100, 0, 100) : 0}%"></span></div>
    </div>
  </div>

  <div class="section-h"><h2>Yaklaşan Ödemeler</h2><button class="link" onclick="go('calendar')">Takvim →</button></div>
  <div class="card">${due.length ? due.slice(0, 5).map(rowDue).join("") : `<div class="empty" style="padding:20px"><p>Önümüzdeki 31 günde ödeme görünmüyor 🎉</p></div>`}</div>

  <div class="dash-2col" style="margin-top:14px">
    <div>
      <div class="card"><div class="card-title">Borç Azalış Projeksiyonu <span class="badge mut">12 ay</span></div>${Charts.line(plab, proj)}
        <p style="font-size:11.5px;color:var(--muted);margin-top:6px">Kredi ve taksit planına göre tahminidir; kart borcu sabit varsayılır.</p></div>
      <div class="card" style="margin-top:12px"><div class="card-title">Nakit Akışı · Son 6 Ay</div>${Charts.bars(blab, binc, bexp)}</div>
    </div>
    <div>
      <div class="card"><div class="card-title">Borç Dağılımı</div>${Charts.donut(dist)}</div>
      <div class="card" style="margin-top:12px"><div class="card-title">${MONTHS[t.getMonth()]} Gider Kategorileri</div>${catSegs.length ? Charts.donut(catSegs) : `<div class="empty" style="padding:14px"><p>Bu ay gider kaydı yok</p></div>`}</div>
    </div>
  </div>

  <div class="section-h"><h2>Son İşlemler</h2><button class="link" onclick="go('money')">Tümü →</button></div>
  <div class="card">${S.txs.length ? [...S.txs].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5).map(rowTx).join("") : `<div class="empty" style="padding:20px"><p>Henüz işlem yok</p></div>`}</div>`;
}
function rowDue(x) {
  const icon = { loan: "bank", card: "card", inst: "bag" }[x.kind];
  const b = x.status === "late" ? `<span class="badge bad">Gecikti</span>` : daysBetween(today(), x.date) === 0 ? `<span class="badge warn">Bugün</span>` : `<span class="badge mut">${relDue(x.date)}</span>`;
  return `<button class="rowitem" onclick="openDetail('${x.kind}','${x.id}')">
    <span class="ic">${Icons[icon](19)}</span>
    <span class="mid"><span class="t">${esc(x.title)}</span><span class="s">${esc(x.note)} · ${fmtDay(x.date)}</span></span>
    <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="amt num">${TL(x.amount)}</span>${b}</span>
  </button>`;
}
function rowTx(x) {
  return `<button class="rowitem" onclick="openTxForm('${x.id}')">
    <span class="ic" style="${x.kind === "in" ? "background:rgba(18,183,106,.12);color:var(--ok)" : ""}">${x.kind === "in" ? Icons.up2(18) : Icons.dn2(18)}</span>
    <span class="mid"><span class="t">${esc(x.title)}</span><span class="s">${esc(x.category)} · ${fmtDay(x.date)}${x.repeat === "monthly" ? " · Aylık" : ""}</span></span>
    <span class="amt num ${x.kind}">${x.kind === "in" ? "+" : "−"}${TL(x.amount, 2)}</span>
  </button>`;
}

/* ---------- KREDİLER ---------- */
let loanFilter = { bank: "", status: "" };
function vLoans() {
  const banks = [...new Set(S.loans.map(l => l.bank))];
  let list = S.loans.filter(l => (!loanFilter.bank || l.bank === loanFilter.bank));
  if (loanFilter.status === "aktif") list = list.filter(l => Calc.loanRemainTerm(l) > 0);
  if (loanFilter.status === "biten") list = list.filter(l => Calc.loanRemainTerm(l) === 0);
  if (loanFilter.status === "geciken") list = list.filter(l => Calc.loanOverdue(l) > 0);
  const totRem = S.loans.reduce((s, l) => s + Calc.loanRemain(l), 0);
  return `${debtTabs("loans")}
  <div class="grid cols-2">
    <div class="card stat"><div class="l">Toplam Kalan</div><div class="v num">${TL(totRem)}</div><div class="d">${S.loans.length} kredi</div></div>
    <div class="card stat"><div class="l">Aylık Taksit</div><div class="v num">${TL(S.loans.reduce((s, l) => s + (Calc.loanRemainTerm(l) ? l.monthly : 0), 0))}</div><div class="d num">Toplam faiz ${TL(S.loans.reduce((s, l) => s + Calc.loanInterest(l), 0))}</div></div>
  </div>
  <div class="filterbar" style="margin-top:12px">
    <select onchange="loanFilter.bank=this.value;render()" aria-label="Banka filtresi">
      <option value="">Tüm bankalar</option>${banks.map(b => `<option ${loanFilter.bank === b ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>
    <select onchange="loanFilter.status=this.value;render()" aria-label="Durum filtresi">
      <option value="">Tüm durumlar</option>
      <option value="aktif" ${loanFilter.status === "aktif" ? "selected" : ""}>Devam eden</option>
      <option value="geciken" ${loanFilter.status === "geciken" ? "selected" : ""}>Geciken</option>
      <option value="biten" ${loanFilter.status === "biten" ? "selected" : ""}>Biten</option></select>
    <button class="btn primary sm" style="margin-left:auto" onclick="openLoanForm()">${Icons.plus(15)} Kredi</button>
  </div>
  ${list.length ? list.map(loanCard).join("") : emptyBox("bank", "Kredi bulunamadı", "Filtreyi değiştir ya da yeni kredi ekle.")}`;
}
function loanCard(l) {
  const rem = Calc.loanRemain(l), pct = clamp(Math.round(l.paid / l.term * 100), 0, 100);
  const od = Calc.loanOverdue(l), done = Calc.loanRemainTerm(l) === 0;
  const nd = Calc.loanNextDue(l);
  return `<div class="card" style="margin-bottom:12px">
    <button class="rowitem" style="border:none;padding:0 0 10px" onclick="openDetail('loan','${l.id}')">
      <span class="ic">${Icons.bank(20)}</span>
      <span class="mid"><span class="t">${esc(l.bank)}</span><span class="s">${esc(l.type)} Kredisi · %${l.rate} aylık</span></span>
      ${done ? `<span class="badge ok">Bitti 🎉</span>` : od ? `<span class="badge bad">${od} taksit gecikti</span>` : `<span class="badge mut">${l.paid}/${l.term}</span>`}
    </button>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <div><div style="font-size:12px;color:var(--muted);font-weight:600">Kalan borç</div><div class="num" style="font-size:20px;font-weight:800">${TL(rem)}</div></div>
      <div style="text-align:right"><div style="font-size:12px;color:var(--muted);font-weight:600">Aylık taksit</div><div class="num" style="font-weight:800">${TL(l.monthly)}</div></div>
    </div>
    <div class="prog ${od ? "bad" : ""}"><span style="width:${pct}%"></span></div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)">
      <span>%${pct} ödendi</span>${nd ? `<span>Sonraki: ${fmtDay(nd)} · ${relDue(nd)}</span>` : `<span>Tamamlandı</span>`}
    </div>
    ${!done ? `<div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn soft sm" onclick="payLoan('${l.id}')">${Icons.check(15)} Taksit Öde</button>
      <button class="btn ghost sm" onclick="openExtraForm('${l.id}')">Ara Ödeme</button>
    </div>` : ""}
  </div>`;
}

/* ---------- KARTLAR ---------- */
function vCards() {
  const limit = S.cards.reduce((s, c) => s + c.limit, 0), used = S.cards.reduce((s, c) => s + c.debt, 0);
  return `${debtTabs("cards")}
  <div class="grid cols-2">
    <div class="card stat"><div class="l">Toplam Kart Borcu</div><div class="v num">${TL(used)}</div><div class="d">${S.cards.length} kart</div></div>
    <div class="card stat"><div class="l">Kullanılabilir Limit</div><div class="v num" style="color:var(--ok)">${TL(Math.max(0, limit - used))}</div><div class="d num">Toplam limit ${TL(limit)}</div></div>
  </div>
  <div class="filterbar" style="margin-top:12px"><button class="btn primary sm" style="margin-left:auto" onclick="openCardForm()">${Icons.plus(15)} Kart</button></div>
  ${S.cards.length ? S.cards.map(cardCard).join("") : emptyBox("card", "Henüz kart yok", "Kredi kartlarını ekleyerek ekstre ve limit takibine başla.")}`;
}
function cardCard(c) {
  const pct = Calc.cardUsePct(c), late = Calc.cardOverdue(c), paidThis = Calc.cardPaidThis(c);
  const linked = S.insts.filter(i => i.cardId === c.id && i.paid < i.total);
  return `<div style="margin-bottom:14px">
    <button class="ccard" style="background:linear-gradient(135deg,${c.color},${c.color}D0)" onclick="openDetail('card','${c.id}')" aria-label="${esc(c.bank)} ${esc(c.name)} kart detayı">
      <div style="display:flex;justify-content:space-between;position:relative;z-index:1"><div><div class="bank">${esc(c.bank).toUpperCase()}</div><div class="cname">${esc(c.name)}</div></div>
      ${late ? `<span class="badge bad" style="background:rgba(255,255,255,.9)">Gecikti</span>` : paidThis ? `<span class="badge ok" style="background:rgba(255,255,255,.9)">Ödendi</span>` : ""}</div>
      <div class="row2"><div><div class="digits">•••• ${esc(c.last4)}</div><div class="mini" style="margin-top:4px">Son ödeme: her ayın ${c.dueDay}'i</div></div>
      <div style="text-align:right"><div class="mini">Güncel borç</div><div class="mval num">${TL(c.debt)}</div></div></div>
    </button>
    <div class="card" style="border-radius:0 0 18px 18px;margin-top:-14px;padding-top:24px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600">
        <span class="num">Limit ${TL(c.limit)}</span><span class="num">Boşta ${TL(Calc.cardAvail(c))}</span></div>

let calCur = null, calSel = null;
function vCal() {
  if (!calCur) { calCur = today(); calSel = today(); }
  const y = calCur.getFullYear(), mo = calCur.getMonth();
  const first = new Date(y, mo, 1), dim = new Date(y, mo + 1, 0).getDate();
  const startDow = (first.getDay() + 6) % 7;
  const events = calMonthEvents(y, mo);
  let cells = "";
  for (let i = 0; i < startDow; i++) { const d = new Date(y, mo, i - startDow + 1); cells += `<span class="cday out">${d.getDate()}</span>`; }
  for (let d = 1; d <= dim; d++) {
    const date = new Date(y, mo, d); const key = iso(date);
    const evs = events[key] || [];
    const isT = key === iso(today()), isSel = calSel && key === iso(calSel);
    const dots = evs.slice(0, 3).map(e => `<i style="background:${e.status === "late" ? "var(--bad)" : e.type === "tx" ? "var(--ok)" : "var(--accent)"}"></i>`).join("");
    cells += `<button class="cday ${isT ? "today" : ""} ${isSel ? "sel" : ""}" onclick="calSel=fromISO('${key}');render()" aria-label="${d} ${MONTHS[mo]}">
      ${d}<span class="dots">${dots}</span></button>`;
  }
  const selEvs = events[iso(calSel)] || [];
  return `<div class="card pad-lg">
    <div class="calhead">
      <button class="iconbtn" onclick="calCur=addMonths(calCur,-1);render()" aria-label="Önceki ay">${Icons.chevL(18)}</button>
      <span class="m">${MONTHS[mo]} ${y}</span>
      <button class="iconbtn" onclick="calCur=addMonths(calCur,1);render()" aria-label="Sonraki ay">${Icons.chevR(18)}</button>
    </div>
    <div class="calgrid">${DOWS.map(d => `<span class="dow">${d}</span>`).join("")}${cells}</div>
    <div class="legend" style="margin-top:14px">
      <span class="li"><span class="sw" style="background:var(--accent)"></span>Ödeme</span>
      <span class="li"><span class="sw" style="background:var(--bad)"></span>Geciken</span>
      <span class="li"><span class="sw" style="background:var(--ok)"></span>İşlem</span></div>
  </div>
  <div class="section-h"><h2>${fmtDate(calSel)}</h2></div>
  <div class="card">${selEvs.length ? selEvs.map(e => e.type === "tx" ? rowTx(e.tx) : rowDue(e)).join("") : `<div class="empty" style="padding:18px"><p>Bu günde kayıt yok</p></div>`}</div>`;
}
function calMonthEvents(y, mo) {
  const map = {}; const push = (k, e) => { (map[k] = map[k] || []).push(e); };
  const inMonth = d => d.getFullYear() === y && d.getMonth() === mo;
  for (const l of S.loans) {
    for (let k = 0; k < l.term; k++) { const d = addMonths(fromISO(l.firstDue), k); if (inMonth(d) && k >= l.paid) { push(iso(d), { type: "due", kind: "loan", id: l.id, title: l.bank + " · " + l.type + " Kredisi", amount: l.monthly, date: d, status: d < today() ? "late" : "due", note: (k + 1) + "/" + l.term + ". taksit" }); } if (d.getFullYear() > y || (d.getFullYear() === y && d.getMonth() > mo)) break; }
  }
  for (const i of S.insts) {
    for (let k = 0; k < i.total; k++) { const d = addMonths(fromISO(i.firstDue), k); if (inMonth(d) && k >= i.paid) { push(iso(d), { type: "due", kind: "inst", id: i.id, title: i.title, amount: i.monthly, date: d, status: d < today() ? "late" : "due", note: (k + 1) + "/" + i.total + ". taksit" }); } if (d.getFullYear() > y || (d.getFullYear() === y && d.getMonth() > mo)) break; }
  }
  for (const c of S.cards) {
    if (c.debt > 0) { const d = new Date(y, mo, clamp(c.dueDay, 1, 28)); if (inMonth(d) && !(c.lastPaid === ymKey(d))) push(iso(d), { type: "due", kind: "card", id: c.id, title: c.bank + " · " + c.name, amount: c.debt, date: d, status: d < today() ? "late" : "due", note: "Kart son ödeme" }); }
  }
  for (const t of S.txs) { const d = fromISO(t.date); if (inMonth(d)) push(iso(d), { type: "tx", tx: t }); if (t.repeat === "monthly" && !inMonth(d) && d <= new Date(y, mo + 1, 0)) { const rd = new Date(y, mo, Math.min(d.getDate(), new Date(y, mo + 1, 0).getDate())); push(iso(rd), { type: "tx", tx: { ...t, date: iso(rd) } }); } }
  for (const k in map) map[k].sort((a, b) => (a.type === "due" ? 0 : 1) - (b.type === "due" ? 0 : 1));
  return map;
}

function dlBlob(name, mime, content) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const csvCell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
function exportCSV() {
  const ym = `${repCur.getFullYear()}-${pad2(repCur.getMonth() + 1)}`;
  const rows = [["Tarih", "Tür", "Başlık", "Kategori", "Tutar", "Tekrar"].join(";")];
  for (const t of [...S.txs].sort((a, b) => a.date.localeCompare(b.date)))
    if (t.date.startsWith(ym) || t.repeat === "monthly")
      rows.push([t.date, t.kind === "in" ? "Gelir" : "Gider", t.title, t.category, String(t.amount).replace(".", ","), t.repeat === "monthly" ? "Aylık" : "-"].map(csvCell).join(";"));
  dlBlob(`denge-islemler-${ym}.csv`, "text/csv;charset=utf-8", "\uFEFF" + rows.join("\n"));
  toast("CSV indirildi");
}
function exportDebtsCSV() {
  const tr = v => String(v).replace(".", ",");
  const rows = [["Tür", "Banka/Başlık", "Detay", "Kalan Borç", "Aylık", "Kalan Ay"].join(";")];
  for (const l of S.loans) rows.push(["Kredi", l.bank, l.type, tr(Calc.loanRemain(l)), tr(l.monthly), Calc.loanRemainTerm(l)].map(csvCell).join(";"));
  for (const c of S.cards) rows.push(["Kredi Kartı", c.bank + " " + c.name, "•••• " + c.last4, tr(c.debt), tr(Calc.cardMin(c)), "-"].map(csvCell).join(";"));
  for (const i of S.insts) rows.push(["Taksit", i.title, i.category, tr(Calc.instRemain(i)), tr(i.monthly), i.total - i.paid].map(csvCell).join(";"));
  dlBlob("denge-borclar.csv", "text/csv;charset=utf-8", "\uFEFF" + rows.join("\n"));
  toast("CSV indirildi");
}

function restore(inp) {
  const f = inp.files[0]; if (!f) return;

  r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !Array.isArray(d.loans)) throw 0; S = { ...blankState(), ...d }; persist(); applyTheme(); render(); toast("Yedek geri yüklendi ✓"); } catch (e) { toast("Dosya okunamadı — geçerli bir Denge yedeği seç"); } };
  r.readAsText(f);
}

const tIn = (id, val = "", ph = "", type = "text", extra = "") => `<input id="f_${id}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}" ${extra}>`;
const nIn = (id, val = "", ph = "0") => tIn(id, val, ph, "number", 'inputmode="decimal" step="0.01" min="0"');
const sel = (id, opts, val) => `<select id="f_${id}">${opts.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(val) ? "selected" : ""}>${esc(t)}</option>`; }).join("")}</select>`;
const gv = id => $("#f_" + id)?.value?.trim() ?? "";
function mark(id, bad) { document.querySelector(`.field[data-f="${id}"]`)?.classList.toggle("invalid", bad); return bad; }
function needTxt(id) { const v = gv(id); return mark(id, !v) ? null : v; }
function needNum(id, min = 0.01) { const v = num(gv(id)); return mark(id, !(v >= min)) ? null : v; }
function needInt(id, min = 1, max = 999) { const v = Math.round(num(gv(id))); return mark(id, !(v >= min && v <= max)) ? null : v; }
function needDate(id) { const v = gv(id); return mark(id, !/^\d{4}-\d{2}-\d{2}$/.test(v)) ? null : v; }

/* ---------- KREDİ formu & işlemleri ---------- */
function openLoanForm(id) {
  const l = S.loans.find(x => x.id === id) || { type: "İhtiyaç", firstDue: iso(addMonths(today(), 1)), paid: 0, rate: "" };
  openModal(id ? "Krediyi Düzenle" : "Yeni Kredi", `
    ${fld("bank", "Banka", tIn("bank", l.bank, "Ziraat Bankası"))}
    <div class="frow">${fld("type", "Kredi Türü", sel("type", LOAN_TYPES, l.type))}${fld("rate", "Aylık Faiz (%)", nIn("rate", l.rate, "3.49"), "Geçerli oran gir")}</div>
    <div class="frow">${fld("amount", "Çekilen Tutar (₺)", nIn("amount", l.amount))}${fld("monthly", "Aylık Taksit (₺)", nIn("monthly", l.monthly))}</div>
    <div class="frow">${fld("term", "Toplam Vade (ay)", nIn("term", l.term, "24"), "1-360 arası")}${fld("paid", "Ödenen Taksit", nIn("paid", l.paid, "0"), "Vadeyi aşamaz")}</div>
    ${fld("firstDue", "İlk Taksit Tarihi", tIn("firstDue", l.firstDue, "", "date"), "Tarih seç")}
    ${fld("notes", "Not (opsiyonel)", tIn("notes", l.notes || "", "Erken kapatma planı vs."))}
    <button class="btn primary block" onclick="saveLoan('${id || ""}')">${id ? "Kaydet" : "Kredi Ekle"}</button>
    ${id ? `<button class="btn danger block" style="margin-top:8px" onclick="delItem('loan','${id}')">${Icons.trash(16)} Krediyi Sil</button>` : ""}`);
}
function saveLoan(id) {
  const bank = needTxt("bank"), type = gv("type"), rate = needNum("rate", 0),
    amount = needNum("amount"), monthly = needNum("monthly"),
    term = needInt("term", 1, 360), firstDue = needDate("firstDue");
  let paid = Math.round(num(gv("paid"))); 
  if ([bank, rate, amount, monthly, term, firstDue].some(v => v === null)) return;
  if (mark("paid", !(paid >= 0 && paid <= term))) return;
  const data = { bank, type, rate, amount, monthly, term, paid, firstDue, notes: gv("notes") };
  const ex = S.loans.find(x => x.id === id);
  if (ex) Object.assign(ex, data); else S.loans.push({ id: uid(), extras: [], ...data });
  persist(); closeModal(); render(); toast(ex ? "Kredi güncellendi ✓" : "Kredi eklendi ✓");
}
function payLoan(id) {
  const l = S.loans.find(x => x.id === id); if (!l || l.paid >= l.term) return;
  l.paid++; persist(); closeModal(); render();
  toast(l.paid >= l.term ? "Son taksit ödendi, kredi bitti! 🎉" : `Taksit ödendi ✓ (${l.paid}/${l.term})`);
}
function openExtraForm(id) {
  openModal("Ara Ödeme", `
    ${fld("xamount", "Tutar (₺)", nIn("xamount"))}
    ${fld("xdate", "Tarih", tIn("xdate", iso(today()), "", "date"))}
    ${fld("xnote", "Not (opsiyonel)", tIn("xnote", "", "İkramiye vb."))}
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Ara ödeme kalan borçtan düşülür; taksit tutarı ve vade değişmez (yaklaşık hesap).</p>
    <button class="btn primary block" onclick="saveExtra('${id}')">Kaydet</button>`);
}
function saveExtra(id) {
  const a = needNum("xamount"), d = needDate("xdate"); if (a === null || d === null) return;
  const l = S.loans.find(x => x.id === id); if (!l) return;
  (l.extras = l.extras || []).push({ id: uid(), amount: a, date: d, note: gv("xnote") });
  persist(); closeModal(); render(); toast("Ara ödeme kaydedildi ✓");
}

function saveCard(id) {
  const bank = needTxt("cbank"), name = needTxt("cname"), limit = needNum("limitv");
  const last4 = gv("last4"); if (mark("last4", !/^\d{4}$/.test(last4))) return;

  const stday = needInt("stday", 1, 28), dueday = needInt("dueday", 1, 28), minrate = needInt("minrate", 1, 100);

  const ex = S.cards.find(x => x.id === id);
  if (ex) Object.assign(ex, data); else S.cards.push({ id: uid(), lastPaid: "", notes: "", ...data });
  persist(); closeModal(); render(); toast(ex ? "Kart güncellendi ✓" : "Kart eklendi ✓");
}

  const c = S.cards.find(x => x.id === id); if (!c) return;
  openModal("Kart Ödemesi", `

function payCard(id) {

/* ---------- Silme + Geri Al ---------- */
let trash = null;
function delItem(kind, id) {
  const pools = { loan: S.loans, card: S.cards, inst: S.insts, tx: S.txs };
  const arr = pools[kind]; const idx = arr.findIndex(x => x.id === id); if (idx < 0) return;
  trash = { kind, item: arr[idx], idx };
  arr.splice(idx, 1); persist(); closeModal(); render();
  toast("Silindi", { undo: () => { const a = pools[trash.kind]; a.splice(Math.min(trash.idx, a.length), 0, trash.item); trash = null; persist(); render(); } });
}

/* ---------- Toast ---------- */
function toast(msg, opt = {}) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>${opt.undo ? `<button class="undo">Geri Al</button>` : ""}`;
  if (opt.undo) el.querySelector(".undo").onclick = () => { opt.undo(); el.remove(); };
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 320); }, opt.undo ? 6000 : 2600);
}

function hideSearch() { const r = $("#searchResults"); r.style.display = "none"; r.innerHTML = ""; }
function runSearch(q) {
  q = q.trim().toLocaleLowerCase("tr");
  const r = $("#searchResults");
  if (q.length < 2) return hideSearch();
  const hit = (s) => String(s || "").toLocaleLowerCase("tr").includes(q);
  const res = [];
  for (const l of S.loans) if (hit(l.bank) || hit(l.type)) res.push({ ic: "bank", t: l.bank + " · " + l.type + " Kredisi", s: "Kredi · kalan " + TL(Calc.loanRemain(l)), fn: `openDetail('loan','${l.id}')` });
  for (const c of S.cards) if (hit(c.bank) || hit(c.name) || hit(c.last4)) res.push({ ic: "card", t: c.bank + " · " + c.name, s: "Kart · borç " + TL(c.debt), fn: `openDetail('card','${c.id}')` });
  for (const i of S.insts) if (hit(i.title) || hit(i.category)) res.push({ ic: "bag", t: i.title, s: "Taksit · " + i.paid + "/" + i.total, fn: `openDetail('inst','${i.id}')` });
  for (const t of S.txs) if (hit(t.title) || hit(t.category)) res.push({ ic: t.kind === "in" ? "up2" : "dn2", t: t.title, s: (t.kind === "in" ? "Gelir" : "Gider") + " · " + fmtDay(t.date) + " · " + TL(t.amount, 2), fn: `openTxForm('${t.id}')` });
  r.innerHTML = res.length ? res.slice(0, 8).map(x =>
    `<button class="sr-item" onclick="hideSearch();${x.fn}"><span style="color:var(--accent)">${Icons[x.ic](17)}</span><span><div class="t">${esc(x.t)}</div><div class="s">${esc(x.s)}</div></span></button>`).join("")
    : `<div style="padding:14px;font-size:13.5px;color:var(--muted)">"${esc(q)}" için sonuç yok</div>`;
  r.style.display = "block";
}

/* ---------- Bildirimler ---------- */
function updateBell() {
  const n = alertCount();
  $("#bellBtn").innerHTML = Icons.bell(19) + (n > 0 ? `<span class="dot"></span>` : "");
}
function toggleNotif() {
  const root = $("#notifRoot");
  if (root.innerHTML) return root.innerHTML = "";
  const items = notifications();
  root.innerHTML = `<div class="notif-panel" role="dialog" aria-label="Bildirimler">
    <div class="nh">Bildirimler</div>
    <div class="nlist">${items.length ? items.map(n =>
      `<div class="rowitem" style="cursor:default"><span class="ic" style="${n.tone === "bad" ? "background:rgba(239,68,68,.12);color:var(--bad)" : n.tone === "warn" ? "background:rgba(245,158,11,.14);color:#B45309" : n.tone === "ok" ? "background:rgba(18,183,106,.12);color:var(--ok)" : ""}">${Icons[n.icon](18)}</span>
      <span class="mid"><span class="t">${esc(n.title)}</span><span class="s">${esc(n.sub)}</span></span></div>`).join("")
      : `<div class="empty" style="padding:20px"><p>Her şey yolunda, bildirim yok 👌</p></div>`}</div></div>`;
}

/* ---------- Tema & Başlatma ---------- */
function applyTheme() {
  document.documentElement.dataset.mode = S.settings.mode || "light";
  document.documentElement.dataset.accent = S.settings.accent || "mavi";
  $("#modeBtn").innerHTML = S.settings.mode === "dark" ? Icons.sun(19) : Icons.moon(19);
}
function init() {
  $("#brandLogo").innerHTML = Icons.scale(18);
  $("#searchIcon").innerHTML = Icons.search(17);
  $("#fabBtn").innerHTML = Icons.plus(26);
  const bn = { dash: ["home", "Özet"], loans: ["bank", "Borçlar"], money: ["coins", "Cüzdan"], menu: ["menu", "Menü"] };
  document.querySelectorAll(".bn-item").forEach(b => { const [ic, t] = bn[b.dataset.go]; b.innerHTML = Icons[ic](22) + `<span>${t}</span>`; b.onclick = () => go(b.dataset.go); });
  $("#fabBtn").onclick = openQuickAdd;
  $("#modeBtn").onclick = () => { setMode(S.settings.mode === "dark" ? "light" : "dark"); applyTheme(); };
  $("#bellBtn").onclick = toggleNotif;
  const gs = $("#globalSearch");
  gs.addEventListener("input", e => runSearch(e.target.value));
  gs.addEventListener("focus", e => runSearch(e.target.value));
  document.addEventListener("click", e => { if (!e.target.closest(".searchwrap")) hideSearch(); if (!e.target.closest(".notif-panel") && !e.target.closest("#bellBtn")) { if ($("#notifRoot").innerHTML) $("#notifRoot").innerHTML = ""; } });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeAll();
    if (e.key === "/" && !e.target.matches("input,select,textarea")) { e.preventDefault(); gs.focus(); }
  });
  applyTheme();
  // kısa skeleton ile premium açılış
  $("#view").innerHTML = `<div class="skel" style="height:150px;border-radius:22px"></div>
    <div class="grid cols-4" style="margin-top:12px">${`<div class="skel" style="height:84px"></div>`.repeat(4)}</div>
    <div class="skel" style="height:220px;margin-top:12px"></div>`;
  setTimeout(render, 350);
}
init();

/* ---------- Ana ekran kısayolları (?add=out, ?go=calendar) ---------- */
(function deepLink() {
  const q = new URLSearchParams(location.search);
  const add = q.get("add"), goTo = q.get("go");
  if (!add && !goTo) return;
  history.replaceState(null, "", location.pathname);
  setTimeout(() => {
    if (goTo && VIEWS[goTo]) go(goTo);
    if (add === "in" || add === "out") openTxForm(null, add);
  }, 420);
})();

/* ---------- Servis çalışanı: çevrimdışı çalışma + otomatik güncelleme ---------- */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloading) return; reloading = true; location.reload();
    });
  });
}
</script>
